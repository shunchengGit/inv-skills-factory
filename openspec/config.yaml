schema: spec-driven

context: |
  ## 项目概述
  这是一个 Claude Code Skills 管理和开发仓库，存放自定义投资分析技能。

  ## 领域
  股票投资分析：估值判断、行业竞争分析、券商研报分析、前置指标追踪。

  ## 技能结构
  每个 skill 位于 `custom-skills/<name>/`，包含：
  - `SKILL.md` — 技能定义文件（YAML frontmatter + Markdown 指令）
  - `_meta.json` — 元数据（name/version/description/commands/scripts/references/dependencies/derivedFrom）
  - `scripts/` — Python 数据脚本
  - `references/` — 参考文档

  ## 技术栈
  - Python 3.10+
  - 数据源：akshare（A股）、yfinance（美港股）、pymupdf（PDF 提取）、playwright（浏览器抓取）
  - 包管理：uv (venv + pip)
  - 行情数据管道：cs-stock（统一入口）→ value-investing-valuation（估值引擎）→ quality-growth-qarp（操作决策）

  ## 依赖关系
  - `cs-stock` — 数据层，所有投资技能的底层依赖
  - `value-investing-valuation` — 估值引擎，依赖 cs-stock
  - `quality-growth-qarp` — 操作决策层，依赖 cs-stock + value-investing-valuation
  - `porter-five-forces-analysis` — 五力分析，依赖 cs-stock
  - `tencent-leading-indicators` / `fuyao-leading-indicators` — 前置指标（独立脚本）
  - `stock-research-report-analysis` — 研报分析（独立脚本）

  ## 命名约定
  - Skill 目录名：kebab-case
  - 脚本文件：snake_case.py
  - 命令前缀：/cs_stock_, /qarp_, /fuyao_, /tencent_, /porter_, /research_pdf_

rules:
  proposal:
    - 用中文写
    - 涉及 skill 依赖变更时标注影响的 skill
  tasks:
    - 每个 task 控制在可一次完成的范围
